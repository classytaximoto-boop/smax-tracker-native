name: Build SMAX Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode keystore
        env:
          SMAX_KEYSTORE_BASE64: ${{ secrets.SMAX_KEYSTORE_BASE64 }}
        run: |
          echo "$SMAX_KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build signed release APK
        env:
          SMAX_KEYSTORE_PASSWORD: ${{ secrets.SMAX_KEYSTORE_PASSWORD }}
          SMAX_KEY_ALIAS: ${{ secrets.SMAX_KEY_ALIAS }}
          SMAX_KEY_PASSWORD: ${{ secrets.SMAX_KEY_PASSWORD }}
        run: |
          export SMAX_KEYSTORE_PATH="$PWD/app/release.jks"
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smax-tracker-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
