plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smax.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.smax.tracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SMAX_KEYSTORE_PATH") ?: "debug-placeholder.jks")
            storePassword System.getenv("SMAX_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("SMAX_KEY_ALIAS") ?: ""
            keyPassword System.getenv("SMAX_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
        }
    }

    buildFeatures {
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
